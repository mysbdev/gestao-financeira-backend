spring.application.name=finanse-backend

# --- Perfil de desenvolvimento: H2 em ARQUIVO (persiste entre reinícios do backend) ---
# O arquivo fica em ./data/finanse.mv.db, dentro da própria pasta do projeto.
spring.datasource.url=jdbc:h2:file:./data/finanse;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# "update" preserva os dados existentes entre reinícios (diferente de create-drop).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# --- JWT ---
# Em produção, mova isso para variável de ambiente (nunca deixe hardcoded em repositório público).
jwt.secret=finanse-tcc-chave-secreta-desenvolvimento-troque-em-producao-32bytes
jwt.expiration-ms=86400000

# --- Para rodar com Postgres depois, comente o bloco H2 acima e descomente: ---
